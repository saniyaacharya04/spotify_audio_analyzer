name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
pytest tests/unit --cov=src --cov-config=.coveragerc --cov-report=term --cov-fail-under=80

      - name: Run E2E tests
        run: |
          chmod +x scripts/e2e.sh
          ./scripts/e2e.sh

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t spotify-audio-analyzer -f docker/Dockerfile .

      - name: Run container
        run: |
          docker run -d -p 8000:8000 --name spotify spotify-audio-analyzer
          sleep 5

      - name: Smoke test
        run: |
          curl -f http://127.0.0.1:8000/health

      - name: Stop container
        run: |
          docker stop spotify
